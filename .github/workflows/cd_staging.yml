name: Deploy to staging (branch master)

on:
  push:
    branches:
      - master

jobs:
  redeploy_allserver:
    name: Deploying every server to staging
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key

          ssh -o StrictHostKeyChecking=no -i ~/ssh_key root@64.227.147.124 << 'EOF'
            cd excalidraw-realtime-editor || exit 1
            git pull
            pnpm install
            pnpm run build
            pm2 restart excalidraw-frontend
            pm2 restart http-backend
            pm2 restart ws-backend
          EOF
